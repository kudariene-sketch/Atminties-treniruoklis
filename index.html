<!DOCTYPE html>
<html lang="lt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Atminties treniruoklis</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- ========================================= -->
    <!-- PASISVEIKINIMO EKRANAS -->
    <!-- ========================================= -->

    <section id="welcomeScreen" class="screen active">

        <h1 id="gameTitle">
            Atminties treniruoklis
        </h1>

        <div class="robot">
            🤖
        </div>

        <h2>Labas!</h2>

        <p>Aš esu robotukė Mintelė.</p>

        <p>Kviečiu lavinti atmintį.</p>

        <button id="startButton">
            Pradėti
        </button>

    </section>

    <!-- ========================================= -->
    <!-- ŽAIDIMO EKRANAS -->
    <!-- ========================================= -->

    <section id="gameScreen" class="screen">

        <header class="gameHeader">

            <h1>Atminties treniruoklis</h1>

            <div class="gameInfo">

                <div id="missionCounter">
                    Misija 1 iš 5
                </div>

                <div id="timer">
                    5
                </div>

            </div>

        </header>

        <div id="instruction">
            Įsimink paveikslėlius.
        </div>

        <div id="imageContainer"></div>

    </section>

    <!-- ========================================= -->
    <!-- ATSAKYMŲ EKRANAS -->
    <!-- ========================================= -->

    <section id="answerScreen" class="screen">

        <h2 id="questionTitle">
            Kuris paveikslėlis buvo rodomas?
        </h2>

        <div id="answersContainer"></div>

    </section>

    <!-- ========================================= -->
    <!-- GRĮŽTAMASIS RYŠYS -->
    <!-- ========================================= -->

    <section id="feedbackScreen" class="screen">

        <div id="feedbackIcon">
            ⭐
        </div>

        <h2 id="feedbackTitle">
            Puiku!
        </h2>

        <p id="feedbackMessage">
            Tu padėjai Mintelei.
        </p>

        <button id="nextButton">
            Kita misija
        </button>

    </section>

    <!-- ========================================= -->
    <!-- PABAIGOS EKRANAS -->
    <!-- ========================================= -->

    <section id="finishScreen" class="screen">

        <h1>🏆</h1>

        <h2>
            Šaunu!
        </h2>

        <p>
            Tu įveikei visas misijas.
        </p>

        <button id="restartButton">
            Žaisti dar kartą
        </button>

    </section>

</div>

<!-- ========================================= -->
<!-- JavaScript failai -->
<!-- ========================================= -->

<script src="config.js"></script>
<script src="ui.js"></script>

<!-- EduSVG biblioteka -->
<script src="images.js"></script>

<script src="questions.js"></script>
<script src="timer.js"></script>
<script src="answers.js"></script>
<script src="feedback.js"></script>
<script src="game.js"></script>

</body>
</html>
