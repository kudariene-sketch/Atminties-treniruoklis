<!DOCTYPE html>
<html lang="lt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Atminties treniruoklis</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div id="app">

    <!-- ================= HEADER ================= -->

    <header class="game-header">

        <h1 id="game-title">
            🧠 Atminties treniruoklis
        </h1>

        <div class="timer-wrapper">
            <div id="timer-circle">
                <span id="timer-value">5</span>
            </div>
        </div>

        <div class="progress-panel">

            <div id="progress-text">
                1 / 10
            </div>

            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>

        </div>

    </header>

    <!-- ================= MAIN ================= -->

    <main>

        <!-- Pasisveikinimo ekranas -->

        <section id="welcomeScreen"
                 class="screen card active">

            <h2>🤖 Labas!</h2>

            <p>
                Aš esu robotukė <strong>Mintelė</strong>.
            </p>

            <p>
                Kviečiu kartu lavinti atmintį.
            </p>

            <button id="startButton">
                Pradėti
            </button>

        </section>

        <!-- Žaidimo ekranas -->

        <section id="gameScreen"
                 class="screen">

            <h2>
                🧠 Žaidimas prasidėjo!
            </h2>

            <p>
                JavaScript jau veikia.
            </p>

        </section>

    </main>

    <!-- ================= FOOTER ================= -->

    <footer>

        <p>
            Skaitmeninių žaidimų laboratorija
        </p>

        <p>
            © 2026 Sigita Koroliovė
        </p>

    </footer>

</div>

<!-- JavaScript failai -->

<script src="config.js"></script>
<script src="ui.js"></script>
<script src="progress.js"></script>
<script src="questions.js"></script>
<script src="game.js"></script>

</body>
</html>
